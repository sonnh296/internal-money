spring.application.name=boost

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rewards?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rewards}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rewards}

spring.sql.init.mode=always

app.executors.platform.size=200

server.tomcat.max-connections=20000
server.tomcat.accept-count=100000

# Redis Connection Pool managed by Redisson (application.yml)
# Virtual threads: enabled=true for I/O-bound workloads (default).
# Set to false if you want to compare platform thread baseline.
spring.threads.virtual.enabled=true

# Kafka consumer for payment.completed events from PaymentOrchestrator
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=pos-boost-rewards
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
