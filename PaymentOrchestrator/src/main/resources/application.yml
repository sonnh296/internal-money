server:
  port: 8086

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8094

      client:
        registration:
          account-m2m:
            provider: mockbank-auth
            authorization-grant-type: client_credentials
            client-id: ${AUTH_M2M_CLIENT_ID:COElk9GHOmWS9L4MAQvscuxA49Cl4mfI}
            client-secret: ${AUTH_M2M_CLIENT_SECRET}
            scope: admin:accounts

        provider:
          mockbank-auth:
            token-uri: http://localhost:8094/oauth/token

  application:
    name: payment-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/paymentdb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${PAYMENT_ORCH_CONSUMER_GROUP:payment-orch-consumers-v1}
      auto-offset-reset: earliest
      # Không tự commit offset — chỉ commit sau khi xử lý thành công để đảm bảo at-least-once
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    listener:
      type: single
      ack-mode: record

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 10000
          account-servicem2m:
            connectTimeout: 5000
            readTimeout: 10000

payments:
  # Chỉ bật khi chạy local không có SettlementService — tránh duplicate pain.002 consumer
  pain002-bridge:
    enabled: ${PAYMENTS_PAIN002_BRIDGE_ENABLED:false}
  recovery:
    capturing-timeout-minutes: 30
    # Sau placeHold — saga kẹt FUNDS_HELD (hold BILLPAY releaseAt 15p, job AccountService không expire BILLPAY)
    stale-funds-held-timeout-minutes: 20
    stale-in-flight-timeout-minutes: 120
    fixed-delay-ms: 300000
    reconciliation-delay-ms: 60000
  topics:
    billpay-requested: billpay.requested
    billpay-enqueued: billpay.enqueued
    bill-batch-ready: bill.batch.ready
    bill-batch-submitted: bill.batch.submitted
    billpay-status: billpay.status
    bill-batch-retry: bill.batch.retry
    bill-batch-resubmit: bill.batch.resubmit
    bill-batch-dlq: bill.batch.dlq

account:
  service:
    url: http://localhost:8084

biller:
  service:
    url: http://localhost:8088

auth:
  jwt:
    audience: https://mockbank/api

feign:
  m2m:
    client-registration-id: account-m2m
    principal: payment-orchestrator

# Outbox publisher delay
outbox:
  publish:
    fixedDelayMs: 5000

resilience4j:
  circuitbreaker:
    instances:
      accountClient:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
      billerClient:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true
  ratelimiter:
    instances:
      billpay:
        # 10 lần thanh toán mỗi phút mỗi instance — rate limit theo IP nên điều chỉnh nếu dùng Redis
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 0s
