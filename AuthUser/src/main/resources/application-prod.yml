server:
  port: 8094

spring:
  application:
    name: auth-user
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_JWT_ISSUER}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      INDENT_OUTPUT: false

cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST"

consent:
  service:
    url: ${CONSENT_SERVICE_URL}

auth0:
  domain: ${AUTH0_DOMAIN}
  mgmt-client-id: ${AUTH0_MGMT_CLIENT_ID}
  mgmt-client-secret: ${AUTH0_MGMT_CLIENT_SECRET}
  audience: ${AUTH0_AUDIENCE}
  loginClientId: ${AUTH0_LOGIN_CLIENT_ID}
  loginClientSecret: ${AUTH0_LOGIN_CLIENT_SECRET}
  loginAudience: ${AUTH0_LOGIN_AUDIENCE}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER}
    audience: ${AUTH_JWT_AUDIENCE}
    access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${AUTH_JWT_REFRESH_TOKEN_TTL:7d}
    default-permissions: ${AUTH_JWT_DEFAULT_PERMISSIONS:fdx:customers.read fdx:accounts.read}
  security:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${AUTH_LOCK_DURATION:15m}
