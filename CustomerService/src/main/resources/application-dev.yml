spring:
  config:
    import: optional:classpath:application-dev-local.yml
  application:
    name: customer-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8094
      client:
        registration:
          account-m2m:
            provider: mockbank-auth
            authorization-grant-type: client_credentials
            client-id: COElk9GHOmWS9L4MAQvscuxA49Cl4mfI
            client-secret: ${ACCOUNT_M2M_CLIENT_SECRET:XXXXXXXXXX}
            scope: admin:accounts,admin:accounts.write
        provider:
          mockbank-auth:
            token-uri: http://localhost:8094/oauth/token
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:sonnh296@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  datasource:
    url: jdbc:postgresql://localhost:5432/customerdb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: false

server:
  port: 8083

  
auth:
  service:
    url: http://localhost:8094
  jwt:
    audience: https://mockbank/api

account:
  service:
    url: http://localhost:8084

feign:
  m2m:
    client-registration-id: account-m2m
    principal: customer-service

app:
  mail:
    from: ${MAIL_FROM:sonnh296@gmail.com}
    enabled: ${MAIL_ENABLED:true}

