server:
  port: 8091

spring:
  application:
    name: eft-worker-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: eft-worker-service
      auto-offset-reset: earliest
    listener:
      ack-mode: record

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eftworkerdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8094

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt:
    audience: https://mockbank/api
